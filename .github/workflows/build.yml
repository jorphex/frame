name: Build a draft Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to v<package version>
        required: false
        type: string

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --global npm@11.12.0
      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version=$(node --print "require('./package.json').version")
          tag="${REQUESTED_TAG:-v${version}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag contains unsupported characters" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - run: npm run setup:ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - run: npm run test:usbAdapters
      - run: npm run bundle
      - run: npm run package:linux:x64
      - run: npm run package:verify:linux
      - name: Generate CycloneDX SBOM
        run: npm run sbom:linux
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*_amd64.deb
      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*_amd64.deb
          sbom-path: dist/frame.cdx.json
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Refusing to replace assets on published release $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_VERSION" --notes "Automated Linux draft build."
          fi
          gh release upload "$RELEASE_TAG" dist/*.AppImage dist/*_amd64.deb dist/SHA256SUMS dist/frame.cdx.json --clobber
